name: Generate DS/DE Project

on:
  schedule:
    # Triggers at 3:30 AM UTC (= 9:00 AM IST) every day (Mon–Sun).
    # A random sleep below spreads the actual run across 9 AM–12 PM IST.
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

# GH_TOKEN set at job level so every step AND every subprocess (git push) can see it
env:
  GH_TOKEN: ${{ secrets.GH_PAT }}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (spreads run between 9 AM and 12 PM IST)
        # Sleeps a random number of seconds up to 10800 (= 3 hours)
        run: sleep $((RANDOM % 10800))

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate GitHub CLI
        run: gh auth status

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run LangGraph automation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: Commit and push updated state
        run: |
          # actions/checkout sets an extraheader with the default GITHUB_TOKEN which
          # overrides URL-embedded credentials. Unset it so our GH_PAT takes effect.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin https://MohitDataSciFi:${{ secrets.GH_PAT }}@github.com/MohitDataSciFi/auto-projects-controller.git
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state.json after project generation"
          git push

