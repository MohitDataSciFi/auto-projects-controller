name: Generate AI/ML Curriculum Project

on:
  schedule:
    # Triggers at 3:30 AM UTC (= 9:00 AM IST) every day (Mon–Sun).
    # A random sleep below spreads the actual run across 9 AM–12 PM IST.
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

env:
  GH_TOKEN:           ${{ secrets.GH_PAT }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay (spreads run between 9 AM and 12 PM IST)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 10800))

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate GitHub CLI
        run: gh auth status

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Git identity
        run: |
          git config --global user.name "MohitDataSciFi"
          git config --global user.email "145323651+MohitDataSciFi@users.noreply.github.com"

      - name: Run LangGraph automation
        id: main_run
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: Run Streak Guard (only on failure)
        if: failure() && steps.main_run.outcome == 'failure'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MAIN_ERROR: ${{ steps.main_run.outputs.error || 'main.py failed' }}
        run: python streak_guard.py

      - name: Commit and push updated state
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin https://MohitDataSciFi:${{ secrets.GH_PAT }}@github.com/MohitDataSciFi/auto-projects-controller.git
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state.json after curriculum run"
          git push
